name: $(Build.BuildId)

pr:
  branches:
    include:
      - Desenv
      - Prod

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: docker_hub
  imageRepositoryDev: hellamah/thinkbitcoin.dev.front
  imageRepositoryProd: hellamah/thinkbitcoin.prod.front
  dockerfilePath: src/Dockerfile
  buildContext: src
  imageTagFile: $(Build.SourcesDirectory)/devops/deploy/image-tag

steps:
  - checkout: self

  - task: PowerShell@2
    displayName: Resolve Docker image repository by branch
    inputs:
      targetType: inline
      script: |
        $prTargetBranch = $env:SYSTEM_PULLREQUEST_TARGETBRANCH
        $sourceBranch = $env:BUILD_SOURCEBRANCH

        $effectiveBranch = if (-not [string]::IsNullOrWhiteSpace($prTargetBranch)) { $prTargetBranch } else { $sourceBranch }

        if ($effectiveBranch -eq "refs/heads/Prod") {
          $repository = "$(imageRepositoryProd)"
          $environment = "prod"
        }
        elseif ($effectiveBranch -eq "refs/heads/Desenv") {
          $repository = "$(imageRepositoryDev)"
          $environment = "desenv"
        }
        else {
          throw "Branch '$effectiveBranch' não suportada para publicação de imagem. Use Desenv ou Prod."
        }

        Write-Host "##vso[task.setvariable variable=imageRepository]$repository"
        Write-Host "##vso[task.setvariable variable=deployEnvironment]$environment"
        Write-Host "Build para ambiente '$environment' usando repositório '$repository'."

  - task: Docker@2
    displayName: buildAndPush docker
    inputs:
      containerRegistry: $(dockerRegistryServiceConnection)
      repository: $(imageRepository)
      command: buildAndPush
      Dockerfile: $(dockerfilePath)
      buildContext: $(buildContext)
      tags: |
        $(Build.BuildId)
        latest

  - task: PowerShell@2
    displayName: Set Helm Image Tag
    inputs:
      targetType: inline
      script: |
        # grava a tag do build em um arquivo que vai junto no artefato image-meta
        $tag  = "$(Build.BuildId)"
        $path = "$(imageTagFile)"

        # Garante que a pasta existe
        $dir = Split-Path -Parent $path
        New-Item -ItemType Directory -Path $dir -Force | Out-Null

        # Grava a tag (UTF-8)
        Set-Content -Path $path -Value $tag -Encoding utf8

        # Usa ${path} para evitar erro com ':'
        Write-Host "Tag escrita em ${path}: $tag"

  - task: CopyFiles@2
    displayName: Copy Files ps1
    inputs:
      SourceFolder: $(Build.SourcesDirectory)/devops
      Contents: |
        deploy/**/*
        helm/thinkbitcoin-front/**/*
      TargetFolder: $(Build.ArtifactStagingDirectory)

  - task: PublishBuildArtifacts@1
    displayName: Publish Artifact image-meta (compatibilidade release clássico)
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: image-meta
      publishLocation: Container
