trigger:
  - Desenv
  - Prod

name: $(Build.BuildId)

pr:
  - Desenv
  - Prod

variables:
  - group: thinkbitcoin-secrets

jobs:
- job: DeployVercel
  displayName: 'Deploy to Vercel'
  pool:
    name: 'ThinkBitcoinDeploy'
  
  steps:
  # Vite 7 exige Node ^20.19.0 || >=22.12.0. Em 18.x o `npm install` ainda passa
  # raspando (só avisa EBADENGINE), mas os testes, que carregam o Vite, quebram.
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: npm install
    workingDirectory: 'src'
    displayName: 'Install Dependencies'

  # Portão do deploy: se a suíte falhar, o job para aqui e nada vai para a
  # Vercel. Sem este passo, os testes existem mas nunca rodam antes do release.
  - script: npm test
    workingDirectory: 'src'
    displayName: 'Run Tests'

  - task: PowerShell@2
    displayName: 'Vercel Deploy'
    inputs:
      targetType: 'inline'
      script: |
        npm install -g vercel
        cd src
        if ("$(Build.SourceBranch)" -eq "refs/heads/Prod") {
            Write-Host "Deploying to Production..."
            vercel --token $(VERCEL_TOKEN) --prod --yes
        }
        else {
            Write-Host "Deploying Preview..."
            vercel --token $(VERCEL_TOKEN) --yes
        }
    env:
      VERCEL_ORG_ID: $(VERCEL_ORG_ID)
      VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)

  - task: PowerShell@2
    displayName: 'Sync Cloudflare Tunnel (Minikube)'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "Syncing Cloudflare Secrets..."
        kubectl --context docker-desktop create secret generic cloudflare-secrets --from-literal=tunnel-token=$(CLOUDFLARE_TUNNEL_TOKEN) -n thinkbitcoin --dry-run=client -o yaml | kubectl --context docker-desktop apply -f -

        Write-Host "Applying Cloudflare Tunnel Deployment..."
        kubectl --context docker-desktop apply -f devops/deploy/cloudflare-tunnel.yaml
