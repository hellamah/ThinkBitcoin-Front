server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Os mesmos cabeçalhos que o vercel.json publica. Existiam só lá: o deploy
    # por container servia o mesmo bundle sem HSTS, sem nosniff e sem CSP, então
    # a postura de segurança do produto dependia de por qual dos dois caminhos
    # ele tinha subido.
    #
    # `always` faz o cabeçalho valer também nas respostas de erro (404, 5xx) —
    # sem ele o nginx só os aplica em 2xx/3xx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # O connect-src carrega, alem dos hosts de producao, as origens locais da
    # API. Esta imagem e o caminho de execucao local (o Helm publica o servico
    # em localhost:3000), e ali o api.js ignora a VITE_API_URL: com hostname
    # localhost ele monta http://localhost:13501 a partir das portas do
    # minikube. Sem essas origens o navegador bloqueia ja o gerarTokenBearer, e
    # o login inteiro morre no console. Producao e a Vercel, com a politica
    # estrita do vercel.json.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com; font-src 'self' data:; img-src 'self' data: blob: https://www.gstatic.com; connect-src 'self' https://api.minerthinkbitcoin.com https://thinkbitcoin-api.ddns.net https://www.gstatic.com http://localhost:* http://127.0.0.1:* https://thinkbitcoin.local:*; frame-src 'none'; upgrade-insecure-requests" always;

    # O bundle do Vite tem hash no nome, então o conteúdo de /assets nunca muda
    # sob a mesma URL e pode ser cacheado para sempre. O index.html não entra
    # nesta regra de propósito: é ele que aponta para os hashes novos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # `add_header` num location descarta os herdados do server, então os
        # cabeçalhos de segurança precisam ser repetidos aqui.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
