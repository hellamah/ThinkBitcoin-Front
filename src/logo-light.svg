<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80" viewBox="0 0 300 80" fill="none">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;800&amp;display=swap');
        .logo-text { font-family: 'Outfit', sans-serif; transition: all 0.3s ease; }
    </style>
    <defs>
        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D4AF37" />
            <stop offset="50%" stop-color="#F9E076" />
            <stop offset="100%" stop-color="#8E6E2E" />
        </linearGradient>
    </defs>
    
    <!-- Robust Geometric Icon -->
    <g transform="translate(15, 15)">
        <!-- Outer Golden Circle -->
        <circle cx="25" cy="25" r="23" stroke="url(#gold-grad)" stroke-width="2.5" />
        
        <!-- Clean B Symbol -->
        <path d="M22 13V37M22 13C28 13 32 16 32 20C32 24 28 25 22 25C28 25 32 26 32 30C32 34 28 37 22 37M20 9V13M24 9V13M20 37V41M24 37V41" 
              stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Subtle connection dots (representing "Think") -->
        <circle cx="25" cy="2" r="2" fill="url(#gold-grad)" />
        <circle cx="25" cy="48" r="2" fill="url(#gold-grad)" />
    </g>
    
    <!-- Approved Typography -->
    <text x="80" y="52" class="logo-text" fill="white" font-size="34" letter-spacing="-1.2">
        <tspan font-weight="200" opacity="0.8">Think</tspan><tspan font-weight="900">Bitcoin</tspan>
    </text>
</svg>
