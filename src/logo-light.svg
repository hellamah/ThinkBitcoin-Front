<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="300" height="80" viewBox="0 0 600 160" fill="none">

  <style>
    .brain-left  { stroke: #FFD700; stroke-width: 5; fill: none; }
    .brain-right { stroke: #00BFFF; stroke-width: 5; fill: none; }
    .symbol      { font-size: 52px; font-weight: bold; fill: #FFD700; font-family: Arial, sans-serif; }
    .text-label  { font-size: 42px; font-weight: 700; fill: #000000; font-family: Inter, sans-serif; }
  </style>

  <g id="logo-icon" transform="translate(20,30)">
    <path class="brain-left" d="M40,90 C20,90 20,60 40,60 C30,40 30,20 40,10" />
    <path class="brain-right" d="M80,90 C100,90 100,60 80,60 C90,40 90,20 80,10" />
    <text class="symbol" x="58" y="75">₿</text>
  </g>

  <g id="logo-text" transform="translate(140,85)">
    <text class="text-label">ThinkBitcoin</text>
  </g>

</svg>
