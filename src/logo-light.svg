<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80" viewBox="0 0 300 80" fill="none">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;800&amp;display=swap');
        .logo-text { font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif; }
    </style>

    <!-- Trading lab mark: erlenmeyer flask inside a hexagon, with a rising trend -->
    <g>
        <polygon points="27,17.5 53,17.5 66,40 53,62.5 27,62.5 14,40"
                 fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linejoin="round" />

        <!-- Flask -->
        <path d="M36 24 L36 35 L26 54 Q25 56.5 27.5 56.5 L52.5 56.5 Q55 56.5 54 54 L44 35 L44 24"
              fill="none" stroke="#FFD700" stroke-width="2.4" stroke-linejoin="round" />
        <line x1="33" y1="24" x2="47" y2="24" stroke="#FFD700" stroke-width="2.4" stroke-linecap="round" />

        <!-- Rising trend (the trade) -->
        <polyline points="30,52 35,47 39,49 45,41"
                  fill="none" stroke="#27c07a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M42 41 L45.5 40.8 L44.8 44"
              fill="none" stroke="#27c07a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Wordmark -->
    <text x="82" y="52" class="logo-text" font-size="32" letter-spacing="-1">
        <tspan font-weight="300" fill="#C9B782">Think</tspan><tspan font-weight="800" fill="#FFD700">Bitcoin</tspan>
    </text>
</svg>
