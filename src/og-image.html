<!DOCTYPE html>
<!--
  Fonte da miniatura de compartilhamento (public/og-image.png).

  Este arquivo NÃO é servido: vive na raiz de src/, fora de public/. Ele existe
  para que a imagem seja regenerável — sem isso, o PNG vira um binário órfão que
  ninguém sabe editar quando a marca mudar.

  Para regerar, com o Chrome instalado:

    "C:/Program Files/Google/Chrome/Application/chrome.exe" \
      --headless --disable-gpu --hide-scrollbars \
      --virtual-time-budget=10000 \
      --screenshot=public/og-image.png --window-size=1200,630 \
      og-image.html

  As cores saem dos tokens de src/index.css (tema escuro) e a marca é a mesma
  do logo-light.svg. As fontes vêm de node_modules/@fontsource, as mesmas que o
  app auto-hospeda — por isso o arquivo referencia node_modules por caminho
  relativo em vez de baixar de fonts.googleapis.com.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Outfit';
    font-weight: 200;
    src: url('./node_modules/@fontsource/outfit/files/outfit-latin-200-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Outfit';
    font-weight: 300;
    src: url('./node_modules/@fontsource/outfit/files/outfit-latin-300-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Outfit';
    font-weight: 800;
    src: url('./node_modules/@fontsource/outfit/files/outfit-latin-800-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Share Tech Mono';
    font-weight: 400;
    src: url('./node_modules/@fontsource/share-tech-mono/files/share-tech-mono-latin-400-normal.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    /* --surface-page, com o brilho dourado que o painel usa nas camadas
       decorativas e um contraponto verde bem apagado no canto oposto. */
    background:
      radial-gradient(900px 620px at 12% 18%, rgba(255, 215, 0, 0.13), transparent 62%),
      radial-gradient(700px 520px at 96% 96%, rgba(76, 175, 80, 0.07), transparent 60%),
      #0d0d0d;
    font-family: 'Outfit', system-ui, sans-serif;
    position: relative;
  }

  /* Grade de fundo: as mesmas hairlines de --border-subtle do painel. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(900px 600px at 30% 45%, #000 35%, transparent 78%);
  }

  /* Barra de marca na borda superior. */
  .accent-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #b8860b, #ffd700 42%, #4caf50);
  }

  .content {
    position: absolute;
    left: 84px; top: 0; bottom: 0;
    width: 660px;
    display: flex; flex-direction: column; justify-content: center;
    /* Sobe o bloco: o rodapé ancora a faixa de baixo, que antes ficava vazia. */
    padding-bottom: 54px;
  }

  .footer {
    position: absolute;
    left: 84px; bottom: 52px;
    display: flex; align-items: center; gap: 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 23px;
    letter-spacing: 1.4px;
    color: rgba(255, 255, 255, 0.5);
  }
  .footer .dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf50; }

  .brand { display: flex; align-items: center; gap: 22px; }

  .wordmark {
    font-size: 78px;
    letter-spacing: -2.5px;
    line-height: 1;
    white-space: nowrap;
  }
  .wordmark .think { font-weight: 300; color: #c9b782; }
  .wordmark .bitcoin { font-weight: 800; color: #ffd700; }

  .tagline {
    margin-top: 30px;
    font-weight: 200;
    font-size: 37px;
    line-height: 1.25;
    letter-spacing: -0.4px;
    color: rgba(255, 255, 255, 0.88);
    max-width: 580px;
  }

  .chips { margin-top: 38px; display: flex; gap: 11px; }

  .chip {
    font-family: 'Share Tech Mono', monospace;
    font-size: 20px;
    letter-spacing: 2.2px;
    color: rgba(255, 215, 0, 0.82);
    border: 1px solid rgba(255, 215, 0, 0.28);
    background: rgba(255, 215, 0, 0.06);
    border-radius: 999px;
    padding: 8px 17px 7px;
  }

  /* O gráfico ocupa a direita e some num fade antes de encostar no texto. */
  .chart {
    position: absolute;
    right: 46px; top: 50%; transform: translateY(-50%);
    width: 520px; height: 420px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 26%, #000 100%);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="accent-bar"></div>

  <svg class="chart" viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- Grade horizontal do gráfico -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <line x1="0" y1="90"  x2="520" y2="90"  />
      <line x1="0" y1="172" x2="520" y2="172" />
      <line x1="0" y1="254" x2="520" y2="254" />
      <line x1="0" y1="336" x2="520" y2="336" />
    </g>

    <!-- Candles: alta = --success (#4caf50), baixa = --danger (#f44336),
         os mesmos valores que themeTokens.js entrega ao gráfico real. -->
    <g stroke-width="2.5">
      <g stroke="#f44336" fill="#f44336">
        <line x1="14"  y1="320" x2="14"  y2="365" /><rect x="4"   y="330" width="20" height="25" />
        <line x1="78"  y1="288" x2="78"  y2="322" /><rect x="68"  y="300" width="20" height="12" />
        <line x1="174" y1="258" x2="174" y2="296" /><rect x="164" y="268" width="20" height="18" />
        <line x1="270" y1="224" x2="270" y2="262" /><rect x="260" y="234" width="20" height="18" />
        <line x1="366" y1="182" x2="366" y2="220" /><rect x="356" y="192" width="20" height="18" />
        <line x1="462" y1="138" x2="462" y2="176" /><rect x="452" y="148" width="20" height="18" />
      </g>
      <g stroke="#4caf50" fill="#4caf50">
        <line x1="46"  y1="296" x2="46"  y2="342" /><rect x="36"  y="305" width="20" height="27" />
        <line x1="110" y1="266" x2="110" y2="312" /><rect x="100" y="275" width="20" height="27" />
        <line x1="142" y1="250" x2="142" y2="288" /><rect x="132" y="262" width="20" height="16" />
        <line x1="206" y1="230" x2="206" y2="280" /><rect x="196" y="240" width="20" height="30" />
        <line x1="238" y1="216" x2="238" y2="254" /><rect x="228" y="228" width="20" height="16" />
        <line x1="302" y1="190" x2="302" y2="246" /><rect x="292" y="200" width="20" height="36" />
        <line x1="334" y1="174" x2="334" y2="214" /><rect x="324" y="186" width="20" height="18" />
        <line x1="398" y1="146" x2="398" y2="204" /><rect x="388" y="156" width="20" height="38" />
        <line x1="430" y1="128" x2="430" y2="170" /><rect x="420" y="140" width="20" height="20" />
        <line x1="494" y1="94"  x2="494" y2="160" /><rect x="484" y="104" width="20" height="46" />
      </g>
    </g>

    <!-- Linha do indicador (VWAP), atrasada em relação ao preço como a real -->
    <polyline
      points="14,356 46,332 78,320 110,302 142,284 174,291 206,269 238,250 270,257 302,232 334,209 366,215 398,189 430,164 462,171 494,141"
      fill="none" stroke="#ffd700" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  </svg>

  <div class="content">
    <div class="brand">
      <!-- Marca do logo-light.svg: hexágono + erlenmeyer + tendência de alta -->
      <svg width="104" height="104" viewBox="12 15 56 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="27,17.5 53,17.5 66,40 53,62.5 27,62.5 14,40"
                 fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M36 24 L36 35 L26 54 Q25 56.5 27.5 56.5 L52.5 56.5 Q55 56.5 54 54 L44 35 L44 24"
              fill="none" stroke="#FFD700" stroke-width="2.4" stroke-linejoin="round" />
        <line x1="33" y1="24" x2="47" y2="24" stroke="#FFD700" stroke-width="2.4" stroke-linecap="round" />
        <polyline points="30,52 35,47 39,49 45,41"
                  fill="none" stroke="#27c07a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M42 41 L45.5 40.8 L44.8 44"
              fill="none" stroke="#27c07a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>

      <div class="wordmark"><span class="think">Think</span><span class="bitcoin">Bitcoin</span></div>
    </div>

    <div class="tagline">Painel de análise de criptoativos —<br />e o desfecho medido de cada sinal.</div>

    <div class="chips">
      <span class="chip">VWAP</span>
      <span class="chip">RSI</span>
      <span class="chip">BOLLINGER</span>
      <span class="chip">ATR</span>
    </div>
  </div>

  <div class="footer">
    <span class="dot"></span>
    <span>minerthinkbitcoin.com</span>
  </div>
</body>
</html>
